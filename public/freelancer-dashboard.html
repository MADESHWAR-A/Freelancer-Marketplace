<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Workly — Freelancer Workspace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="freelancer">
<canvas id="particles"></canvas>
<div class="app-shell">
  <aside class="sidebar glass">
    <a class="brand" href="/">WORKLY<span>.</span></a>
    <nav>
      <a class="nav-link active" href="#feed">Project feed</a>
      <a class="nav-link" href="#bids">My bids</a>
      <a class="nav-link" href="#profile">Profile</a>
    </nav>
    <button id="logoutBtn" class="btn btn-ghost full">Sign out</button>
  </aside>

  <main class="dashboard">
    <header class="page-head">
      <div><span class="eyebrow">FREELANCER WORKSPACE</span><h1>Find work that fits <span id="userName">you</span>.</h1></div>
    </header>

    <section class="stats-grid">
      <article class="glass stat-card"><span>Open projects</span><strong id="openCount">—</strong></article>
      <article class="glass stat-card"><span>My proposals</span><strong id="proposalCount">—</strong></article>
      <article class="glass stat-card"><span>Accepted</span><strong id="acceptedCount">—</strong></article>
    </section>

    <section id="feed" class="panel">
      <div class="section-head"><div><h2>Project feed</h2><p>Browse current opportunities.</p></div></div>
      <div id="projectFeed" class="project-list skeleton-wrap"></div>
    </section>

    <section id="bids" class="panel">
      <div class="section-head"><div><h2>My bids</h2><p>Track proposal outcomes.</p></div></div>
      <div id="myBids" class="project-list"></div>
    </section>

    <section id="profile" class="panel">
      <div class="section-head"><div><h2>Freelancer profile</h2><p>Show clients what you can deliver.</p></div></div>
      <form id="freelancerProfileForm" class="form-grid">
        <label>Skills<input name="skills" placeholder="Node.js, SQL, UI/UX"></label>
        <label>Hourly rate ($/hr)<input name="hourly_rate" type="number" min="0" step="0.01"></label>
        <label>Portfolio URL<input name="portfolio_url" type="url"></label>
        <label>Company / brand<input name="company_name"></label>
        <label class="span-2">Bio<textarea name="bio" rows="5"></textarea></label>
        <button class="btn btn-primary" type="submit">Save profile</button>
      </form>
    </section>
  </main>
</div>

<div id="proposalModal" class="modal hidden">
  <div class="modal-card glass">
    <button class="modal-close" data-close="proposalModal">×</button>
    <h2>Submit proposal</h2>
    <form id="proposalForm" class="form-grid">
      <input type="hidden" name="project_id" id="proposalProjectId">
      <label>Bid amount ($)<input name="bid_amount" type="number" min="1" step="0.01" required></label>
      <label>Delivery (days)<input name="delivery_days" type="number" min="1" required></label>
      <label class="span-2">Cover letter<textarea name="cover_letter" rows="7" required></textarea></label>
      <button class="btn btn-primary" type="submit">Send proposal</button>
    </form>
  </div>
</div>
<div id="chatModal" class="modal hidden">
  <div class="modal-card glass chat-card">
    <button class="modal-close" data-close="chatModal">×</button>
    <h2>Live chat</h2>
    <div id="chatMessages" class="chat-messages"></div>
    <form id="chatForm" class="chat-input"><input id="chatText" placeholder="Write a message…" maxlength="4000" required><button class="btn btn-primary">Send</button></form>
  </div>
</div>
<div id="toast-root"></div>
<script src="script.js"></script>
</body>
</html>
